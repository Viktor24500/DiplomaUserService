version: "3.8"
services:
  UserService:
    container_name: UserService
    build:
      context: .
      dockerfile: SystemUserService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5004
      - Main=Data Source=lde.sqlserver,1433; User ID=sa;Password=Your123Strong123Password; Initial Catalog=DiplomaUserServiceDB
    depends_on:
      - lde.sqlserver
    ports:
      - 5004:5004
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Your123Strong123Password
      - MSSQL_PID=Developer
      - MSSQL_AGENT_ENABLED=true
    volumes:
      - .\lde.sqlserver:/var/opt/mssql/data
    ports:
      - 1433:1433
